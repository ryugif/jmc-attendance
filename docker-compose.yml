services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: better_auth
      MYSQL_USER: better_auth
      MYSQL_PASSWORD: better_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "better_auth", "-pbetter_auth"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: